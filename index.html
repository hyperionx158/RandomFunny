<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub</title>
  <meta name="description" content="GameHub — games streamed from private cloud storage.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0b1020; overflow: hidden; }
    iframe {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; background: #0b1020; opacity: 0;
      transition: opacity 0.35s ease;
    }
    iframe.ready { opacity: 1; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center; gap: 16px;
      background: radial-gradient(800px 400px at 50% 35%, #1b2a5e55, transparent 70%), #0b1020;
      color: #e7ecf7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; transition: opacity 0.35s ease; z-index: 2;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid #2a3556; border-top-color: #6d8cff;
      animation: spin 0.9s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
    .sub { color: #8b96b3; font-size: 0.82rem; margin-top: 6px; }
    #fallback { display: none; margin-top: 18px; }
    #fallback a { color: #8fa8ff; font-size: 0.85rem; text-decoration: none; }
    #fallback a:hover { text-decoration: underline; }
    #fallback.show { display: block; }
  </style>
</head>
<body>
  <iframe
    id="hub"
    src="https://assets.hyperionx175.com/storage/RandomFunny/pages/index.html"
    title="GameHub"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    allowfullscreen
    referrerpolicy="no-referrer"
  ></iframe>

  <div id="loading">
    <div>
      <div class="spinner"></div>
      <div class="title">Loading GameHub</div>
      <div class="sub">Connecting to cloud storage…</div>
      <div id="fallback"><a id="directLink" href="#" target="_blank" rel="noopener">Taking too long? Open directly</a></div>
    </div>
  </div>

  <script>
    const HUB_URL = 'https://assets.hyperionx175.com/storage/RandomFunny/pages/index.html';
    const frame = document.getElementById('hub');
    const loading = document.getElementById('loading');
    const fallback = document.getElementById('fallback');
    document.getElementById('directLink').href = HUB_URL;

    let revealed = false;
    function reveal() {
      if (revealed) return;
      revealed = true;
      frame.classList.add('ready');
      loading.classList.add('hidden');
    }

    frame.addEventListener('load', reveal);
    setTimeout(reveal, 6000);
    setTimeout(() => fallback.classList.add('show'), 10000);
  </script>
</body>
</html>
