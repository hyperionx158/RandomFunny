<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Site - MinIO Cloud</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
    .header { text-align: center; padding: 3rem 1rem; }
    .header h1 { font-size: 2.5rem; background: linear-gradient(135deg, #f8fafc, #e2e8f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 1rem; }
    .header p { color: #64748b; font-size: 1.1rem; }
    .games { background: #1e293b; border-radius: 16px; padding: 2rem; margin-top: 3rem; }
    .game-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; transition: transform 0.2s; }
    .game-card:hover { transform: translateY(-4px); }
    .game-image { width: 100%; height: 150px; background: #334155; border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem; }
    .game-info { display: flex; flex-direction: column; }
    .game-info h3 { font-size: 1.2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #f8fafc, #e2e8f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .game-info p { color: #64748b; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .game-tag { background: #3b82f6; color: white; padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; margin-top: 0.5rem; }
    .no-games { text-align: center; padding: 4rem; color: #64748b; }
    .status { padding: 1rem; border-radius: 8px; margin: 2rem 0; }
    .status.connected { background: #14532d; color: #d1e7dd; }
    .status.error { background: #7f1d1d; color: #fecaca; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎮 Game Site</h1>
      <p>Play HTML5 games from your MinIO cloud</p>
    </div>
    <div class="status" id="status" class="error">Connecting to MinIO...</div>
    <div class="games" id="games">
      <!-- Games loaded by JavaScript -->
    </div>
  </div>
  <script>
    const MINIO_URL = 'http://freely-rising-enemies-clock.trycloudflare.com'; // CHANGE THIS to your current tunnel URL
    const ACCESS_KEY = 'admin';
    const SECRET_KEY = 'MySecretGamePass123';
    let tunnelRunning = false;
    
    async function loadGames() {
      const gamesDiv = document.getElementById('games');
      const status = document.getElementById('status');
      
      status.textContent = 'Connecting to MinIO...';
      status.className = 'status error';
      
      try {
        const authHeader = 'Basic ' + btoa(`${ACCESS_KEY}:${SECRET_KEY}`);
        const response = await fetch(`${MINIO_URL}/minio`, { headers: { 'Authorization': authHeader }, timeout: 8000 });
        
        if (response.ok) {
          const data = await response.json();
          const games = data.objects || data || [];
          
          status.textContent = 'MinIO Connected';
          status.className = 'status connected';
          
          if (games.length === 0) {
            gamesDiv.innerHTML = '<div class="no-games">No games found in bucket</div>';
            return;
          }
          
          let html = '';
          games.forEach((game, i) => {
            const filename = game.key || game.name || `game-${i}`;
            const name = filename.replace(/\.(html?|zip)$/i, '').replace(/-/g, ' ').replace(/_/g, ' ');
            html += `<div class="game-card"><div class="game-image">${filename.slice(0, 3)}...</div><div class="game-info"><h3>${name}</h3><p>${filename}</p><span class="game-tag">MinIO</span></div></div>`;
          });
          gamesDiv.innerHTML = html;
        } else {
          throw new Error(`MinIO returned ${response.status}`);
        }
      } catch (error) {
        console.error('Error loading games:', error);
        status.textContent = 'MinIO Connection Failed';
        status.className = 'status error';
        gamesDiv.innerHTML = '<div class="no-games">Could not connect to MinIO.<br/>• Check Cloudflare Tunnel is running<br/>• Verify the tunnel URL is correct</div>';
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadGames);
    
    // Periodic retry
    setInterval(() => {
      if (document.getElementById('status').className !== 'status connected') {
        loadGames();
      }
    }, 15000);
  </script>
</body>
</html>
