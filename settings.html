<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Dev Portal</title>
    <link rel="stylesheet" href="https://assets.hyperionx175.com/storage/RandomFunny/assets/css/Main.css">
    <link rel="stylesheet" href="https://assets.hyperionx175.com/storage/RandomFunny/assets/css/settings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.css">
</head>
<body>

    <div class="settings-layout">

        <!-- ── Topbar ── -->
        <header class="settings-topbar">
            <div class="topbar-left">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portal</a>
                <h1 class="settings-title"><i class="fas fa-cog"></i> Settings</h1>
            </div>
            <div class="topbar-right">
                <div id="topbarProfile" class="topbar-profile" style="display:none;">
                    <div id="topbarAvatar" class="topbar-avatar"></div>
                    <span id="topbarUsername" class="topbar-username"></span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </header>

        <!-- ── Profile Dropdown ── -->
        <div id="profileDropdown" class="profile-dropdown" style="display:none;">
            <div class="dropdown-header">
                <div id="dropdownAvatar" class="dropdown-avatar"></div>
                <div class="dropdown-user-info">
                    <span id="dropdownUsername" class="dropdown-username"></span>
                    <span id="dropdownEmail" class="dropdown-email"></span>
                </div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="#" class="dropdown-item" id="editProfileBtn">
                <i class="fas fa-user-edit"></i> Edit Profile
            </a>
            <a href="#" class="dropdown-item" id="settingsBtn">
                <i class="fas fa-cog"></i> Settings
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- ── Main content ── -->
        <main class="settings-main">
            <div class="settings-tabs" id="settingsTabs">
                <!-- Tabs will be inserted here by JS -->
            </div>
        </main>

    </div>

    <!-- ═══ EDIT PROFILE MODAL ═══ -->
    <div id="editProfileModal" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3><i class="fas fa-user-edit"></i> Edit Profile</h3>
                <button class="modal-close" onclick="closeEditProfileModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="profile-preview-section">
                    <div class="preview-card">
                        <div class="preview-avatar" id="previewAvatar"></div>
                        <div class="preview-info">
                            <h4 id="previewUsername">Username</h4>
                            <p id="previewTitle" class="preview-title">No Title</p>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h4>Profile Picture</h4>
                    <div class="form-group">
                        <label>Avatar URL (Image/GIF)</label>
                        <div class="avatar-input-group">
                            <input type="url" id="avatarUrlInput" class="settings-input" placeholder="https://example.com/avatar.gif or .png, .jpg, .webp">
                            <button class="btn btn-secondary" onclick="testAvatarUrl()"><i class="fas fa-eye"></i> Preview</button>
                        </div>
                        <p class="form-hint">Paste a direct link to an image or GIF. Max 5MB recommended.</p>
                    </div>
                    <div class="avatar-preview" id="avatarPreview" style="display:none;">
                        <img id="avatarPreviewImg" src="" alt="Preview" style="max-width: 100px; max-height: 100px; border-radius: 50%; border: 2px solid var(--border);">
                    </div>
                </div>

                <div class="form-section">
                    <h4>Display Name</h4>
                    <div class="form-group">
                        <input type="text" id="displayNameInput" class="settings-input" placeholder="Your display name" maxlength="30">
                    </div>
                </div>

                <div class="form-section">
                    <h4>Real Name (Private)</h4>
                    <div class="form-group">
                        <input type="text" id="realNameInput" class="settings-input" placeholder="Your real name (not shown publicly)">
                    </div>
                </div>

                <div class="form-section">
                    <h4>Bio</h4>
                    <div class="form-group">
                        <textarea id="bioInput" class="settings-input" placeholder="Tell others about yourself..." rows="3" maxlength="200"></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h4>Equipped Title</h4>
                    <div class="title-selector" id="titleSelector">
                        <!-- Titles will be populated by JS -->
                    </div>
                </div>

                <div class="form-section">
                    <h4>Text Effect</h4>
                    <div class="effect-selector" id="effectSelector">
                        <!-- Text effects will be populated by JS -->
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeEditProfileModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveProfile()"><i class="fas fa-save"></i> Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://assets.hyperionx175.com/storage/RandomFunny/scripts/firebase-init.js"></script>
    <script src="https://assets.hyperionx175.com/storage/RandomFunny/scripts/auth.js"></script>
    <script src="https://assets.hyperionx175.com/storage/RandomFunny/assets/js/settings.js"></script>
</body>
</html>
